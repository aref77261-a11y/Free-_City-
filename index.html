<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2ecc71">
    <title>المدينة الحرة</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div id="game-container">
        <!-- Resources Bar -->
        <div id="resources-bar">
            <div class="resource" data-type="money">
                <span class="resource-icon">💰</span>
                <span class="resource-value" id="res-money">1000</span>
            </div>
            <div class="resource" data-type="energy">
                <span class="resource-icon">⚡</span>
                <span class="resource-value" id="res-energy">100</span>
            </div>
            <div class="resource" data-type="water">
                <span class="resource-icon">💧</span>
                <span class="resource-value" id="res-water">100</span>
            </div>
            <div class="resource" data-type="food">
                <span class="resource-icon">🍞</span>
                <span class="resource-value" id="res-food">100</span>
            </div>
            <div class="resource" data-type="population">
                <span class="resource-icon">👥</span>
                <span class="resource-value" id="res-population">0</span>
            </div>
            <div class="resource" data-type="happiness">
                <span class="resource-icon">😊</span>
                <span class="resource-value" id="res-happiness">50</span>
            </div>
            <div class="resource" data-type="sustainability">
                <span class="resource-icon">🌱</span>
                <span class="resource-value" id="res-sustainability">50</span>
            </div>
        </div>

        <!-- Game Title -->
        <header id="game-header">
            <h1>🏙️ المدينة الحرة</h1>
            <p>بني مدينتك وطوّرها!</p>
        </header>

        <!-- City Grid -->
        <div id="city-grid"></div>

        <!-- Building Selector Modal -->
        <div id="building-modal" class="modal hidden">
            <div class="modal-overlay"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <h2>🏗️ اختر مبنى</h2>
                    <button class="modal-close" onclick="closeBuildingModal()">✕</button>
                </div>
                <div class="modal-body" id="building-list"></div>
            </div>
        </div>

        <!-- Toast Container -->
        <div id="toast-container"></div>
    </div>

    <script src="assets/js/game.js"></script>
</body>
</html>
